spring.application.name=supernova-colheita-api
server.port=8080


spring.datasource.url=jdbc:h2:mem:supernova;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false


spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
app.rabbitmq.exchange=supernova.pedidos
app.rabbitmq.fila-notificacoes=supernova.pedidos.notificacoes


app.jwt.secret=${JWT_SECRET:supernova-colheita-chave-local-trocar-em-producao}
app.jwt.expiracao-horas=8


spring.ai.google.genai.api-key=${GEMINI_API_KEY:sem-chave}
spring.ai.google.genai.chat.options.model=${IA_MODELO:gemini-3.5-flash-lite}
spring.ai.google.genai.chat.options.max-output-tokens=16000
spring.ai.retry.max-attempts=2


springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

management.endpoints.web.exposure.include=health,info
